[workspace]
name = "talk_with_the_engineer"
version = "0.0.1"
description = "Talk with the engineer"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]
readme = "README.md"
license = "GPL-3.0"
license-file = "LICENSE"

[tasks]
# Installation
install = "pre-commit install"
# main.py staat in src/ en importeert zichzelf als src.main, dus het modulepad is
# src.main en niet main.
start = { cmd = "uvicorn src.main:app --host 0.0.0.0 --port 8000" }
start-dev = { cmd = "uvicorn src.main:app --host 127.0.0.1 --port 8000 --reload" }

# run scripts
#script = { cmd = "python scipts.py", cwd = "scripts" }

# Docs
quartodoc-build = { cmd = "quartodoc build && rm objects.json", cwd = "docs" ,inputs = [
    "docs/_quarto.yml",
    "src/talk_with_the_engineer",
    ],outputs = [
    "docs/reference/"
    ]}
quarto-preview = { cmd = "export QUARTO_PYTHON=python && quarto preview docs", depends-on = [
    "quartodoc-build",
] }
quarto-check = { cmd = "quarto check all", depends-on = ["quartodoc-build"] }
quarto-render = { cmd = "export QUARTO_PYTHON=python && quarto render docs --to html --execute", depends-on = [
    "quartodoc-build",
] }
docs = { depends-on = ["quarto-preview"] }
pre-commit = "pre-commit run --all-files"

test = "pytest"

[tool.ruff]
# Ruff configuration, see https://docs.astral.sh/ruff/configuration/
# lint.ignore = [
    # "E402",   # module not at top of py file
    #"E501",  # Line too long
    #"F401",  # Unused import
    #"F403",  # 'from module import *' used; unable to detect undefined names
    #"F405",  # Name may be undefined, or defined from star imports: module
    #"F841",  # Local variable name is assigned to but never used
    #"T201",  # Use of print statement (use print() function instead)
# ]

[dependencies]
python = ">=3.11"
ipykernel = ">=6.29.5,<7"
ipywidgets ="*"
nbclient ="*"
nbformat ="*"
pre-commit = "*"
pytest-cov = "*"
quarto = ">=1.5.57"
quartodoc = ">=0.9.1"
ruff = ">=0.8.1"
tqdm = "*"
python-dotenv = ">=1.0.1"
openai = ">=3.0.0,<4"
pydantic = ">=2.0.0"
pytest = ">=8.4.1,<9"
pytest-asyncio = ">=1.0.0,<2"
matplotlib = ">=3.10.3,<4"
fastapi = ">=0.120,<1"
fastmcp = ">=3.4.7,<4"
duckdb = ">=1.3.2,<2"
geopandas = ">=1.1.1,<2"
xmlschema = ">=4.1.0,<5"
requests = ">=2.31.0,<3"
beautifulsoup4 = ">=4.12.0,<5"
pip = ">=25.1.1,<26"
lxml = ">=6.0.0,<7"
html5lib = ">=1.1,<2"
pydantic-ai = ">=2.33,<3"
nodejs = ">=24.4.1,<24.5"
openpyxl = "*"
# Gebruikt door de pakketzoeker: SLSQP als continue oplosser per actiemix.
scipy = ">=1.16,<2"

[pypi-dependencies]
talk_with_the_engineer = { path = "src", editable = true }

# JAX als optionele feature, en bewust via PyPI en niet via conda-forge. Twee redenen, en
# beide zijn gemeten en niet aangenomen:
#
#   1. conda-forge heeft jaxlib alleen voor linux-64, linux-aarch64, osx-64 en osx-arm64.
#      Dit project declareert ook win-64, dus daar loopt de conda-solve op vast. Op PyPI
#      zijn er wel win_amd64-wheels.
#   2. de ondergrens is 0.11 en niet lager, want dit project draait op python 3.14 en
#      jaxlib heeft cp314-wheels pas vanaf die reeks. Met een lagere ondergrens meldt de
#      solver "we only found wheels with ABI tags cp310..cp313".
#   3. en op die versie is er geen osx-64-wheel meer: JAX heeft Intel-Mac laten vallen.
#      Vandaar de eigen `platforms` hieronder - drie van de vier. De DEFAULT-omgeving houdt
#      alle vier, dus niemand die geen JAX gebruikt merkt hier iets van.
#
# De kern is geschikt gemaakt en de schakelaar staat op numpy; omdraaien is een aparte stap.
# Installeren met: pixi install -e jax
[feature.jax]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.jax.pypi-dependencies]
jax = ">=0.11"

[environments]
jax = ["jax"]
