[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "talk_with_the_engineer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["talk_with_the_engineer"]

[project]
name = "talk_with_the_engineer"
version = "0.0.1"
description = "Talk with the Engineer"
readme = "README.md"
license = {text = "GNU-GPL V3"}
authors = [
  { name = "Mattijn van Hoek"},
  { name = "David Haasnoot"},
]

dependencies = [
  "python-dotenv",
  "openai",
  "pydantic",
  "pydantic-ai",
  "streamlit",
  "pytest",
  "pytest-asyncio",
]

[project.urls]
Documentation = "https://delta-agents.github.io/talk-with-the-engineer/"
Source = "https://github.com/delta-agents/talk-with-the-engineer"
