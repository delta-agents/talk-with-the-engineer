<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1080" viewBox="0 0 1400 1080" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: bold; }
    .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #555555; }
    .card { fill: #FFFFFF; stroke: #DDDDDD; stroke-width: 1.5; }
    .card-head { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; }
    .card-sub { font-family: Arial, sans-serif; font-size: 15px; font-style: italic; fill: #777777; }
    .body { font-family: Arial, sans-serif; font-size: 17px; }
    .cell { font-family: Arial, sans-serif; font-size: 15px; }
    .cell-label { font-family: Arial, sans-serif; font-size: 16px; }
    .foot { font-family: Arial, sans-serif; font-size: 15px; }
    .tag { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #777777; }
    .colhead { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0D47A1; }
    .yes { font-family: Arial, sans-serif; font-size: 15px; fill: #2E7D32; }
    .no { font-family: Arial, sans-serif; font-size: 15px; fill: #C62828; }
    .rule { stroke: #EEEEEE; stroke-width: 1.5; }
    .punch { fill: #E8F0FE; stroke: #0D47A1; stroke-width: 1.5; }
    .punch-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .ok { stroke: #2E7D32; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .cross { stroke: #C62828; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .half { stroke: #E65100; stroke-width: 4; fill: none; stroke-linecap: round; }
  </style>

  <text class="title" x="60" y="58">Twee keer een world model, twee verschillende vragen</text>
  <text class="subtitle" x="60" y="92">Ribasim en onze vuistregels lijken op elkaar. Het verschil zit in wat er vastligt en wat er beweegt.</text>

  <!-- ================= BAND 1: wat ligt vast, wat beweegt ================= -->

  <rect class="card" x="60" y="125" width="630" height="215" rx="8" />
  <text class="card-head" x="90" y="162">Ribasim</text>
  <text class="card-sub" x="90" y="188">een model om een watersysteem te laten dr&#225;aien</text>
  <text class="tag" x="90" y="232">WAT VASTLIGT</text>
  <text class="body" x="250" y="232">de polder: gemaal, stuw, sloten</text>
  <text class="tag" x="90" y="270">WAT BEWEEGT</text>
  <text class="body" x="250" y="270">het water</text>
  <text class="tag" x="90" y="308">DE VRAAG</text>
  <text class="body" x="250" y="308">&#8220;wat gebeurt er met het water?&#8221;</text>

  <rect class="card" x="710" y="125" width="630" height="215" rx="8" />
  <text class="card-head" x="740" y="162">Onze vuistregels</text>
  <text class="card-sub" x="740" y="188">een model om een watersysteem te ontwerpen</text>
  <text class="tag" x="740" y="232">WAT VASTLIGT</text>
  <text class="body" x="900" y="232">de bui</text>
  <text class="tag" x="740" y="270">WAT BEWEEGT</text>
  <text class="body" x="900" y="270">de polder zelf</text>
  <text class="tag" x="740" y="308">DE VRAAG</text>
  <text class="body" x="900" y="308">&#8220;hoe moet de polder worden?&#8221;</text>

  <!-- ================= BAND 2: de test met het gemaal ================= -->

  <rect class="card" x="60" y="370" width="1280" height="250" rx="8" />
  <text class="card-head" x="90" y="406">De test: het gemaal</text>
  <text class="card-sub" x="90" y="432">twee maatregelen die op elkaar lijken, en waar de twee modellen precies omdraaien</text>

  <text class="colhead" x="712" y="474" text-anchor="middle">RIBASIM</text>
  <text class="colhead" x="1133" y="474" text-anchor="middle">ONZE VUISTREGELS</text>

  <text class="cell-label" x="90" y="512">Het gemaal &#225;nders aanzetten</text>
  <path class="ok" d="M 506,506 L 512,513 L 523,499" />
  <text class="cell" x="537" y="512">regelregels per kunstwerk, met tijdreeksen</text>
  <path class="half" d="M 936,506 L 954,506" />
  <text class="cell" x="967" y="512">alleen voorbemaling, en verder niet</text>

  <text class="cell-label" x="90" y="552">Het gemaal gr&#243;ter maken</text>
  <path class="cross" d="M 506,539 L 521,554" />
  <path class="cross" d="M 521,539 L 506,554" />
  <text class="cell" x="537" y="552">wel in te voeren, geen stap in het model</text>
  <path class="ok" d="M 936,546 L 942,553 L 953,539" />
  <text class="cell" x="967" y="552">&#233;&#233;n stap, met een prijs eraan</text>

  <rect class="punch" x="90" y="572" width="1220" height="36" rx="6" />
  <text class="punch-text" x="110" y="596">Allebei een gat &#8212; en het zijn niet dezelfde gaten. D&#225;t is het punt.</text>

  <!-- ================= BAND 3: dezelfde vragen naast elkaar ================= -->

  <rect class="card" x="60" y="650" width="1280" height="252" rx="8" />
  <text class="card-head" x="90" y="686">Dezelfde vragen, langs elkaar gelegd</text>
  <text class="colhead" x="810" y="718" text-anchor="middle">RIBASIM</text>
  <text class="colhead" x="1165" y="718" text-anchor="middle">WIJ</text>

  <line class="rule" x1="90" y1="730" x2="1310" y2="730" />
  <text class="cell-label" x="90" y="758">Weet het hoe de polder er nu voor staat?</text>
  <text class="yes" x="640" y="758">ja, veel preciezer dan wij</text>
  <text class="yes" x="1000" y="758">ja, in een handvol getallen</text>

  <line class="rule" x1="90" y1="772" x2="1310" y2="772" />
  <text class="cell-label" x="90" y="800">Zeg &#8216;doe dit&#8217;: krijg je een nieuwe polder terug?</text>
  <text class="no" x="640" y="800">nee, je past de invoer aan</text>
  <text class="yes" x="1000" y="800">ja, dat is de hele opzet</text>

  <line class="rule" x1="90" y1="814" x2="1310" y2="814" />
  <text class="cell-label" x="90" y="842">Rekent het uit wat een pakket kost?</text>
  <text class="no" x="640" y="842">nee, er zitten geen euro&#8217;s in</text>
  <text class="yes" x="1000" y="842">ja &#8212; en het zegt wat geen prijs heeft</text>

  <line class="rule" x1="90" y1="856" x2="1310" y2="856" />
  <text class="cell-label" x="90" y="884">Verdeelt het bij tekort over veel gebruikers?</text>
  <text class="yes" x="640" y="884">ja, en netter dan wij</text>
  <text class="no" x="1000" y="884">alleen als ieder &#233;&#233;n bron heeft</text>

  <!-- ================= BAND 4: drie voetkaarten ================= -->

  <rect class="card" x="60" y="932" width="406" height="130" rx="8" />
  <text class="card-head" x="88" y="967">Dus niet: wij zijn beter</text>
  <text class="foot" x="88" y="995">Ribasim is een world model voor het</text>
  <text class="foot" x="88" y="1016">dr&#225;aien van een systeem, het onze voor</text>
  <text class="foot" x="88" y="1037">het ontwerpen. Twee vragen, twee vormen.</text>

  <rect class="card" x="497" y="932" width="406" height="130" rx="8" />
  <text class="card-head" x="525" y="967">En niet: wij zijn sneller</text>
  <text class="foot" x="525" y="995">Ribasim rekent een veel zwaarder systeem</text>
  <text class="foot" x="525" y="1016">door. Wij hebben geen snelheid nodig maar</text>
  <text class="foot" x="525" y="1037">een som waarvan je duizenden kunt doen.</text>

  <rect class="card" x="934" y="932" width="406" height="130" rx="8" />
  <text class="card-head" x="962" y="967">Wat je hiermee w&#233;l kunt vragen</text>
  <text class="foot" x="962" y="995">&#8220;Wat is goedkoper: een groter gemaal of</text>
  <text class="foot" x="962" y="1016">meer open water?&#8221; Dan moet een maatregel</text>
  <text class="foot" x="962" y="1037">een ding zijn, met een prijs eraan.</text>

</svg>
