<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="1110" viewBox="0 0 1400 1110" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: bold; }
    .subtitle { font-family: Arial, sans-serif; font-size: 17px; fill: #555555; }
    .card { fill: #FFFFFF; stroke: #DDDDDD; stroke-width: 1.5; }
    .card-head { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; }
    .card-sub { font-family: Arial, sans-serif; font-size: 15px; font-style: italic; fill: #777777; }
    .sea { fill: #DCEBF5; stroke: #B9D4E4; stroke-width: 1.5; }
    .coast { fill: none; stroke: #4E6340; stroke-width: 2.5; }
    .island { fill: #E7EDDF; stroke: #4E6340; stroke-width: 1.5; }
    .lake { fill: #9FC7E8; stroke: #17558C; stroke-width: 2; }
    .border-old { stroke: #6B5B4B; stroke-width: 3; fill: none; }
    .out { stroke: #17558C; stroke-width: 2.5; fill: none; }
    .canal { stroke: #2E7D32; stroke-width: 4; fill: none; stroke-dasharray: 11,7; }
    .dot-dry { fill: #E65100; stroke: #FFFFFF; stroke-width: 2; }
    .dot-wet { fill: #2E7D32; stroke: #FFFFFF; stroke-width: 2; }
    .dot-city { fill: #FFFFFF; stroke: #4E6340; stroke-width: 2; }
    .place { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #33402A; }
    .place-lake { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0D3C61; }
    .leg-text { font-family: Arial, sans-serif; font-size: 13px; }
    .key-grey { fill: #F5F3F0; stroke: #A99B8A; stroke-width: 1.5; }
    .key-green { fill: #E8F5E9; stroke: #388E3C; stroke-width: 1.5; }
    .key-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .stamp { fill: #FFF4E5; stroke: #E65100; stroke-width: 2; }
    .stamp-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #B34700; }
    .col-a { fill: #E8F5E9; stroke: #388E3C; stroke-width: 1.5; }
    .col-b { fill: #FDECEA; stroke: #C62828; stroke-width: 1.5; }
    .col-c { fill: #E8F0FE; stroke: #0D47A1; stroke-width: 1.5; }
    .col-head { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .col-line { font-family: Arial, sans-serif; font-size: 14px; }
  </style>

  <defs>
    <marker id="mout" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#17558C" />
    </marker>
    <marker id="mcanal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#2E7D32" />
    </marker>

    <pattern id="fine" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#E7EDDF" />
      <path d="M 15,0 L 0,0 L 0,15" fill="none" stroke="#AFC098" stroke-width="1" />
    </pattern>
    <pattern id="coarse" width="58" height="58" patternUnits="userSpaceOnUse">
      <rect width="58" height="58" fill="#E7EDDF" />
      <path d="M 58,0 L 0,0 L 0,58" fill="none" stroke="#6E9150" stroke-width="2" />
    </pattern>

    <path id="nl" d="M 80,105 L 100,78 L 145,92 L 200,78 L 250,70 L 292,62 L 330,72
      L 346,105 L 334,150 L 346,185 L 375,235 L 366,275 L 334,285 L 325,310 L 296,320
      L 284,340 L 275,380 L 263,420 L 254,470 L 238,520 L 218,480 L 227,430 L 221,385
      L 208,350 L 167,345 L 125,352 L 75,340 L 33,330 L 25,300 L 12,265 L 21,225
      L 33,190 L 54,150 Z" />

    <path id="ijssel" d="M 115,112 L 150,102 L 172,120 L 176,152 L 160,180 L 130,184
      L 112,162 L 106,132 Z" />

    <clipPath id="clipnl">
      <path d="M 80,105 L 100,78 L 145,92 L 200,78 L 250,70 L 292,62 L 330,72
        L 346,105 L 334,150 L 346,185 L 375,235 L 366,275 L 334,285 L 325,310 L 296,320
        L 284,340 L 275,380 L 263,420 L 254,470 L 238,520 L 218,480 L 227,430 L 221,385
        L 208,350 L 167,345 L 125,352 L 75,340 L 33,330 L 25,300 L 12,265 L 21,225
        L 33,190 L 54,150 Z" />
    </clipPath>
  </defs>

  <text class="title" x="60" y="58">Nederland, nu en misschien straks</text>
  <text class="subtitle" x="60" y="92">Links hoe we het water nu verdelen. Rechts een gedachtenexperiment: niet een uitkomst van het model, maar de vraag die het zou moeten kunnen stellen.</text>

  <!-- ============================ LINKS: NU ============================ -->

  <rect class="card" x="60" y="125" width="630" height="755" rx="8" />
  <text class="card-head" x="90" y="166">Nu</text>
  <text class="card-sub" x="90" y="192">8.500 stukjes, elk met een eigen som en een eigen gemaal</text>

  <g transform="translate(180,195)">
    <rect class="sea" x="-15" y="30" width="410" height="515" rx="10" />

    <ellipse class="island" cx="120" cy="62" rx="16" ry="5" />
    <ellipse class="island" cx="170" cy="54" rx="18" ry="5" />
    <ellipse class="island" cx="300" cy="46" rx="14" ry="5" />

    <use href="#nl" fill="url(#fine)" />
    <use href="#nl" class="coast" />

    <g clip-path="url(#clipnl)">
      <path class="border-old" d="M 12,215 L 200,205 L 250,150 L 346,140" />
      <path class="border-old" d="M 25,300 L 190,295 L 300,255 L 375,250" />
      <path class="border-old" d="M 150,90 L 165,205" />
      <path class="border-old" d="M 240,70 L 255,255" />
      <path class="border-old" d="M 208,350 L 230,300 L 296,320" />
    </g>

    <use href="#ijssel" class="lake" />
    <text class="place-lake" x="141" y="147" text-anchor="middle">IJsselmeer</text>

    <path class="out" d="M 22,300 L 2,300" marker-end="url(#mout)" />
    <path class="out" d="M 12,262 L -6,258" marker-end="url(#mout)" />
    <path class="out" d="M 22,222 L 4,214" marker-end="url(#mout)" />
    <path class="out" d="M 34,186 L 16,176" marker-end="url(#mout)" />
    <path class="out" d="M 78,108 L 62,90" marker-end="url(#mout)" />
    <path class="out" d="M 40,332 L 24,346" marker-end="url(#mout)" />

    <circle class="dot-dry" cx="358" cy="250" r="8" />
    <text class="place" x="344" y="235" text-anchor="end">Twente</text>
    <circle class="dot-dry" cx="322" cy="300" r="7" />
    <text class="place" x="310" y="306" text-anchor="end">Achterhoek</text>
    <circle class="dot-city" cx="70" cy="200" r="5" />
    <text class="place" x="82" y="205">Randstad</text>
    <circle class="dot-city" cx="238" cy="505" r="5" />
    <text class="place" x="228" y="510" text-anchor="end">Maastricht</text>
  </g>

  <rect x="90" y="752" width="22" height="22" fill="url(#fine)" stroke="#4E6340" stroke-width="1.5" />
  <text class="leg-text" x="122" y="768">8.500 eenheden</text>
  <line class="border-old" x1="392" y1="763" x2="414" y2="763" />
  <text class="leg-text" x="424" y="768">grenzen van vroeger</text>

  <path class="out" d="M 92,798 L 112,798" marker-end="url(#mout)" />
  <text class="leg-text" x="122" y="803">elk pompt naar buiten</text>
  <circle class="dot-dry" cx="403" cy="798" r="8" />
  <text class="leg-text" x="424" y="803">water is hier schaars</text>

  <rect class="key-grey" x="90" y="818" width="570" height="52" rx="8" />
  <text class="key-text" x="110" y="850">Ieder rekent zijn eigen stuk, en de grenzen volgen het water niet.</text>

  <!-- ============================ RECHTS: STRAKS ============================ -->

  <rect class="card" x="710" y="125" width="630" height="755" rx="8" />
  <text class="card-head" x="740" y="166">Misschien straks</text>
  <text class="card-sub" x="740" y="192">grovere stukken, en lijnen die er nu nog niet liggen</text>

  <g transform="translate(830,195)">
    <rect class="sea" x="-15" y="30" width="410" height="515" rx="10" />

    <ellipse class="island" cx="120" cy="62" rx="16" ry="5" />
    <ellipse class="island" cx="170" cy="54" rx="18" ry="5" />
    <ellipse class="island" cx="300" cy="46" rx="14" ry="5" />

    <use href="#nl" fill="url(#coarse)" />
    <use href="#nl" class="coast" />

    <use href="#ijssel" class="lake" />
    <text class="place-lake" x="141" y="147" text-anchor="middle">IJsselmeer</text>

    <path class="canal" d="M 168,158 C 240,172 300,208 344,240" marker-end="url(#mcanal)" />
    <path class="canal" d="M 158,180 C 220,224 272,268 310,294" marker-end="url(#mcanal)" />

    <path class="out" d="M 22,300 L 2,300" marker-end="url(#mout)" />
    <path class="out" d="M 12,262 L -6,258" marker-end="url(#mout)" />

    <circle class="dot-wet" cx="358" cy="250" r="8" />
    <text class="place" x="344" y="232" text-anchor="end">Twente</text>
    <circle class="dot-wet" cx="322" cy="300" r="7" />
    <text class="place" x="330" y="322">Achterhoek</text>
    <circle class="dot-city" cx="70" cy="200" r="5" />
    <text class="place" x="82" y="205">Randstad</text>
    <circle class="dot-city" cx="238" cy="505" r="5" />
    <text class="place" x="228" y="510" text-anchor="end">Maastricht</text>

    <rect class="stamp" x="30" y="452" width="196" height="34" rx="6" />
    <text class="stamp-text" x="128" y="475" text-anchor="middle">verzonnen, niet gerekend</text>
  </g>

  <rect x="740" y="752" width="22" height="22" fill="url(#coarse)" stroke="#4E6340" stroke-width="1.5" />
  <text class="leg-text" x="772" y="768">ongeveer 250 districten</text>
  <path class="canal" d="M 1042,763 L 1068,763" />
  <text class="leg-text" x="1078" y="768">nieuwe verbindingen</text>

  <circle class="dot-wet" cx="751" cy="798" r="8" />
  <text class="leg-text" x="772" y="803">hier is dan w&#233;l water</text>
  <path class="out" d="M 1046,798 L 1066,798" marker-end="url(#mout)" />
  <text class="leg-text" x="1078" y="803">minder naar buiten</text>

  <rect class="key-green" x="740" y="818" width="570" height="52" rx="8" />
  <text class="key-text" x="760" y="850">Beslissen waar de koppeling zit, en de lijn zelf mag de maatregel zijn.</text>

  <!-- ============================ VOET: wat hier waar is ============================ -->

  <rect class="card" x="60" y="910" width="1280" height="170" rx="8" />
  <text class="card-head" x="90" y="950">Wat hiervan gemeten is, en wat niet</text>

  <rect class="col-a" x="90" y="968" width="380" height="98" rx="8" />
  <text class="col-head" x="110" y="994">Dit is gemeten</text>
  <text class="col-line" x="110" y="1018">Per polder beslissen geeft het verkeerde</text>
  <text class="col-line" x="110" y="1038">antwoord: afvoeren gaat van &#8364; 66 k naar</text>
  <text class="col-line" x="110" y="1058">&#8364; 502 k per cm, en bergen wint.</text>

  <rect class="col-b" x="510" y="968" width="380" height="98" rx="8" />
  <text class="col-head" x="530" y="994">Dit is verzonnen</text>
  <text class="col-line" x="530" y="1018">Elke grens en elke lijn op de rechterkaart.</text>
  <text class="col-line" x="530" y="1038">Er zit geen echte topologie in het model;</text>
  <text class="col-line" x="530" y="1058">de meting hierboven is een ketting van vijf.</text>

  <rect class="col-c" x="930" y="968" width="380" height="98" rx="8" />
  <text class="col-head" x="950" y="994">Dit is er nodig</text>
  <text class="col-line" x="950" y="1018">Een maatregel die een l&#237;jn toevoegt, een</text>
  <text class="col-line" x="950" y="1038">prijs voor een verbinding, en een bron die</text>
  <text class="col-line" x="950" y="1058">eindig is en gedeeld wordt.</text>

</svg>
