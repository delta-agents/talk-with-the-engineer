---
project:
  type: website
  # docs/plannen/ is een archief van plan- en bouwdocumenten; die horen niet in de
  # gerenderde website, dus ze zijn hier uitgesloten van de render.
  render:
    - "*"
    - "!plannen/"

website:
  title: "Talk with the engineer"
  navbar:
    left:
      - text: "Demo"
        file: demo.qmd
      - text: "Documentatie"
        menu:
          - examples/notebooks/vuistregels.ipynb
      - text: "Python API"
        file: reference/index.qmd
    right:
      - icon: github
        href: https://github.com/HKV-products-services/talk_with_the_engineer
        aria-label: GitHub
      - text: "Contributing"
        file: contributing.qmd
format:
  html:
    theme: cosmo
    toc: true


quartodoc:
  style: pkgdown
  dir: reference
  title: API Reference
  package: talk_with_the_engineer
  parser: google
  dynamic: True
  rewrite_all_pages: True
  options:
    include_inherited: true
    include_empty: true
    include_attributes: true
    include_classes: true
    include_functions: true
  sections:
    - title: Tools
      desc: Beschikbare tools
      package: talk_with_the_engineer.tools
      contents:
        - calculate_retention_given_h
        - calculate_retention_given_area
        - calculate_store_given_area
        - calculate_store_given_h
        - calculate_discharge_given_h
        - calculate_discharge_given_discharge
