<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De polder als MDP — presentatie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app"></div>

<div class="hulp" id="hulp" hidden>
  <dl>
    <dt>→ spatie</dt><dd>volgende beat</dd>
    <dt>←</dt><dd>vorige beat</dd>
    <dt>↓ ↑</dt><dd>volgende of vorige stap</dd>
    <dt>1 … 7</dt><dd>rechtstreeks naar een stap</dd>
    <dt>Esc</dt><dd>terug naar de titel</dd>
    <dt>f</dt><dd>volledig scherm</dd>
    <dt>?</dt><dd>deze hulp</dd>
  </dl>
</div>

<!-- Klassieke scripts, geen modules: dit werkt ook op file:// en zonder netwerk. -->
<script src="inhoud.js"></script>
<script src="presentatie.js"></script>
</body>
</html>
