---
# Wat er op https://hkv-products-services.github.io/talk-with-the-engineer/ komt
# te staan, en in welke volgorde het gebouwd wordt.
#
# De WORTEL is de talk. Dat is een map met statische bestanden en geen build
# step: geen ES-modules, geen bundler, geen netwerk. Kopiëren is genoeg, en dat
# is met opzet zo gebouwd - dezelfde map opent ook met een dubbelklik.
#
# De casusdeck staat op /usecases/: drie polders, één rekenkern, en het
# aanroepen zelf als uitkomst. Zelfde bouwwijze, dus ook kopiëren is genoeg.
#
# De Quarto-site staat ERONDER, op /docs/. Hij blijft dus gewoon gepubliceerd
# met de API-reference, de demo en de contributing-pagina; alleen is hij niet
# meer het eerste wat je ziet. Quarto legt zijn links relatief aan, dus die
# verhuizing kost niets.
name: Render and Publish site

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# You need these permissions to publish to GitHub pages
permissions:
    contents: write
    pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: python_package_template

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: python_package_template/pixi.toml
          pixi-version: "latest"

      - name: Check Quarto installation and all engines
        working-directory: python_package_template
        run: pixi run quarto-check

      - name: Render Quarto Project
        working-directory: python_package_template
        run: pixi run quarto-render

      - name: Assemble the site
        working-directory: python_package_template
        run: |
          set -euo pipefail
          rm -rf _publish
          mkdir -p _publish/docs

          # de talk op de wortel; de README is bouwdocumentatie en gaat niet mee
          cp -R talk/mdp-presentatie/. _publish/
          rm -f _publish/README.md _publish/.DS_Store

          # de casusdeck eronder, op /usecases/ - zelfde behandeling
          mkdir -p _publish/usecases
          cp -R talk/mdp-usecases/. _publish/usecases/
          rm -f _publish/usecases/README.md _publish/usecases/.DS_Store

          # en de Quarto-site eronder
          cp -R docs/_site/. _publish/docs/

          # zonder dit laat Jekyll bestanden met een _ ervoor weg
          touch _publish/.nojekyll

          test -f _publish/index.html
          test -f _publish/usecases/index.html
          test -f _publish/docs/index.html
          echo "gepubliceerd wordt:"
          ls -la _publish

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: python_package_template/_publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
